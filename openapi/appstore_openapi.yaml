components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    appToken:
      type: http
      scheme: bearer
      description: OAuth token issued to an installed app
    deviceAuth:
      type: apiKey
      in: header
      name: X-Agent-Token
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        requestId:
          type: string
    Plan:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        unit:
          type: string
          enum:
          - free
          - tenant
          - outlet
          - device
          - user
        priceMonth:
          type: number
        priceYear:
          type: number
        trialDays:
          type: integer
        limits:
          type: object
    AppSummary:
      type: object
      properties:
        slug:
          type: string
          example: kds
        name:
          type: string
        tagline:
          type: string
        category:
          type: string
          enum:
          - sales
          - kitchen
          - inventory
          - customers
          - finance
          - people
          - devices
          - online
          - analytics
          - ai
          - marketing
          - industry
        iconUrl:
          type: string
        developer:
          type: string
        verified:
          type: boolean
        ratingAvg:
          type: number
        ratingCount:
          type: integer
        installCount:
          type: integer
        priceFrom:
          type: number
        latestVersion:
          type: string
        isCore:
          type: boolean
        installed:
          type: boolean
    AppDetail:
      allOf:
      - $ref: '#/components/schemas/AppSummary'
      - type: object
        properties:
          descriptionMd:
            type: string
          screenshots:
            type: array
            items:
              type: string
          businessTypes:
            type: array
            items:
              type: string
          runtime:
            type: string
            enum:
            - cloud
            - edge
            - hybrid
          scopes:
            type: array
            items:
              type: object
              properties:
                scope:
                  type: string
                reason:
                  type: string
                sensitive:
                  type: boolean
          plans:
            type: array
            items:
              $ref: '#/components/schemas/Plan'
          requires:
            type: array
            items:
              type: object
              properties:
                slug:
                  type: string
                minVersion:
                  type: string
          supportEmail:
            type: string
          privacyUrl:
            type: string
          releaseNotes:
            type: string
    Rating:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stars:
          type: integer
        comment:
          type: string
        business:
          type: string
        devReply:
          type: string
        createdAt:
          type: string
          format: date-time
    InstallRequest:
      type: object
      properties:
        appSlug:
          type: string
        planCode:
          type: string
        outletIds:
          type: array
          items:
            type: string
            format: uuid
        grantedScopes:
          type: array
          items:
            type: string
        billingCycle:
          type: string
          enum:
          - month
          - year
    Installation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        app:
          $ref: '#/components/schemas/AppSummary'
        version:
          type: string
        availableVersion:
          type: string
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          type: string
          enum:
          - pending_payment
          - installing
          - active
          - update_available
          - suspended
          - uninstalled
          - failed
        outletIds:
          type: array
          items:
            type: string
            format: uuid
        grantedScopes:
          type: array
          items:
            type: string
        autoUpdate:
          type: boolean
        config:
          type: object
        paymentLink:
          type: string
        installedAt:
          type: string
          format: date-time
    Deployment:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        version:
          type: string
        status:
          type: string
          enum:
          - queued
          - pulling
          - starting
          - running
          - failed
          - rolled_back
          - removed
        cpuPct:
          type: number
        memMb:
          type: integer
        lastHeartbeat:
          type: string
          format: date-time
        error:
          type: string
    Manifest:
      type: object
      properties:
        id:
          type: string
          example: in.kitchenmetrics.foodcost-pro
        name:
          type: string
        version:
          type: string
          example: 1.1.0
        runtime:
          type: string
          enum:
          - cloud
          - edge
          - hybrid
        minPlatform:
          type: string
        scopes:
          type: array
          items:
            type: object
            properties:
              scope:
                type: string
              reason:
                type: string
        events:
          type: array
          items:
            type: string
        ui:
          type: object
          properties:
            entry:
              type: string
            slots:
              type: array
              items:
                type: string
                enum:
                - console.sidebar
                - console.dashboard.widget
                - pos.order.action
                - pos.receipt.footer
                - kds.ticket.badge
                - settings.page
        edge:
          type: object
          properties:
            image:
              type: string
            ports:
              type: array
              items:
                type: integer
            resources:
              type: object
              properties:
                cpu:
                  type: string
                memory:
                  type: string
            volumes:
              type: array
              items:
                type: string
        webhooks:
          type: array
          items:
            type: object
            properties:
              event:
                type: string
              path:
                type: string
        settingsSchema:
          type: object
    Developer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - first_party
          - partner
          - independent
        email:
          type: string
        isVerified:
          type: boolean
        revenueSharePct:
          type: number
    DevApp:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        packageId:
          type: string
        name:
          type: string
        tagline:
          type: string
        category:
          type: string
          enum:
          - sales
          - kitchen
          - inventory
          - customers
          - finance
          - people
          - devices
          - online
          - analytics
          - ai
          - marketing
          - industry
        status:
          type: string
          enum:
          - draft
          - listed
          - unlisted
          - delisted
        descriptionMd:
          type: string
        iconUrl:
          type: string
        screenshots:
          type: array
          items:
            type: string
        businessTypes:
          type: array
          items:
            type: string
        supportEmail:
          type: string
        privacyUrl:
          type: string
    CreateVersionRequest:
      type: object
      properties:
        version:
          type: string
        channel:
          type: string
          enum:
          - stable
          - beta
          - internal
        releaseNotes:
          type: string
        bundleSha256:
          type: string
        bundleSize:
          type: integer
    CreateVersionResponse:
      type: object
      properties:
        versionId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          description: presigned S3 PUT URL, 15 min
        uploadHeaders:
          type: object
    Check:
      type: object
      properties:
        kind:
          type: string
          enum:
          - manifest
          - dependencies
          - security_scan
          - license
          - arm64_build
          - permissions
          - performance
          - accessibility
        status:
          type: string
          enum:
          - pending
          - running
          - passed
          - warning
          - failed
        summary:
          type: string
        reportUrl:
          type: string
    Version:
      type: object
      properties:
        id:
          type: string
          format: uuid
        appSlug:
          type: string
        version:
          type: string
        channel:
          type: string
        status:
          type: string
          enum:
          - draft
          - submitted
          - checking
          - in_review
          - changes_requested
          - approved
          - published
          - rejected
          - withdrawn
          - superseded
        rolloutPct:
          type: integer
        manifest:
          $ref: '#/components/schemas/Manifest'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
        reviews:
          type: array
          items:
            type: object
            properties:
              decision:
                type: string
              notes:
                type: string
              reviewer:
                type: string
              createdAt:
                type: string
                format: date-time
        submittedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
    ReviewDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - approve
          - request_changes
          - reject
        notes:
          type: string
        checklist:
          type: object
    AppAnalytics:
      type: object
      properties:
        installs:
          type: integer
        activeInstalls:
          type: integer
        uninstalls30d:
          type: integer
        mrr:
          type: number
        ratingAvg:
          type: number
        apiCalls30d:
          type: integer
        errorRate:
          type: number
        byDay:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              installs:
                type: integer
              uninstalls:
                type: integer
              revenue:
                type: number
        versions:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
              installs:
                type: integer
    Payout:
      type: object
