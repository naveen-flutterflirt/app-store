openapi: 3.1.0
info:
  title: BizBox App Store API
  version: 1.0.0
  description: 'Storefront, installations, developer publishing, review and the BizBox edge agent.

    Same auth and error conventions as the BizBox POS API.'
  contact:
    name: FlutterFlirt Private Limited
    email: info@flutterflirt.com
    url: https://www.flutterflirt.com
servers:
- url: https://api.bizbox.flutterflirt.com/v1
security:
- bearerAuth: []
tags:
- name: Storefront
- name: Installations
- name: App runtime
- name: Developer
- name: Review & Admin
- name: Edge agent
- name: Webhooks
paths:
  /store/apps:
    get:
      tags:
      - Storefront
      summary: Browse & search apps (q, category, businessType, sort=popular|rating|new, cursor)
      operationId: get_store_apps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppSummary'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.view
  /store/featured:
    get:
      tags:
      - Storefront
      summary: 'Home page rails: featured, essentials for your business type, new'
      operationId: get_store_featured
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.view
  /store/categories:
    get:
      tags:
      - Storefront
      summary: Categories with app counts
      operationId: get_store_categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    name:
                      type: string
                    count:
                      type: integer
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.view
  /store/apps/{slug}:
    get:
      tags:
      - Storefront
      summary: App details, plans, permissions, dependencies
      operationId: get_store_apps_slug
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.view
  /store/apps/{slug}/ratings:
    get:
      tags:
      - Storefront
      summary: Ratings & reviews
      operationId: get_store_apps_slug_ratings
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rating'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.view
    post:
      tags:
      - Storefront
      summary: Rate an installed app (one per business)
      operationId: post_store_apps_slug_ratings
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stars:
                  type: integer
                comment:
                  type: string
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.install
  /installations:
    post:
      tags:
      - Installations
      summary: 'Install app: checks deps → creates subscription → provisions cloud + edge'
      operationId: post_installations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.install
    get:
      tags:
      - Installations
      summary: My installed apps with update status
      operationId: get_installations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Installation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.view
  /installations/{installationId}:
    get:
      tags:
      - Installations
      summary: Installation details
      operationId: get_installations_installationId
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.view
    patch:
      tags:
      - Installations
      summary: Change settings, outlets, auto-update
      operationId: patch_installations_installationId
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                outletIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                autoUpdate:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.install
    delete:
      tags:
      - Installations
      summary: Uninstall (data kept 30 days, then purged)
      operationId: delete_installations_installationId
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.install
  /installations/{installationId}/update:
    post:
      tags:
      - Installations
      summary: Update to latest (or given) version
      operationId: post_installations_installationId_update
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.install
  /installations/{installationId}/rollback:
    post:
      tags:
      - Installations
      summary: Roll back to previous version
      operationId: post_installations_installationId_rollback
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.install
  /installations/{installationId}/plan:
    post:
      tags:
      - Installations
      summary: Upgrade / downgrade plan
      operationId: post_installations_installationId_plan
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planCode:
                  type: string
                billingCycle:
                  type: string
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: billing.manage
  /installations/{installationId}/deployments:
    get:
      tags:
      - Installations
      summary: 'Where it runs: edge boxes & health'
      operationId: get_installations_installationId_deployments
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: store.view
  /billing/subscriptions:
    get:
      tags:
      - Installations
      summary: All app subscriptions & next invoice
      operationId: get_billing_subscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: billing.manage
  /oauth/token:
    post:
      tags:
      - App runtime
      summary: App gets a tenant-scoped token (client_credentials + installation_id)
      operationId: post_oauth_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                installation_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      security: []
  /app/context:
    get:
      tags:
      - App runtime
      summary: Installation context for the calling app (tenant, outlets, scopes, settings)
      operationId: get_app_context
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      security:
      - appToken: []
  /app/webhooks:
    post:
      tags:
      - App runtime
      summary: Subscribe the installation to platform events
      operationId: post_app_webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                targetUrl:
                  type: string
      responses:
        '202':
          description: OK
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      security:
      - appToken: []
  /app/events:
    get:
      tags:
      - App runtime
      summary: Event catalog the app may subscribe to
      operationId: get_app_events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    event:
                      type: string
                    scope:
                      type: string
                    sample:
                      type: object
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      security:
      - appToken: []
  /app/usage:
    post:
      tags:
      - App runtime
      summary: Report metered usage (messages sent, AI queries)
      operationId: post_app_usage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metric:
                  type: string
                quantity:
                  type: integer
      responses:
        '202':
          description: OK
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      security:
      - appToken: []
  /dev/developers:
    post:
      tags:
      - Developer
      summary: Create a publisher account (KYC + payout onboarding link)
      operationId: post_dev_developers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Developer'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Developer'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /dev/me:
    get:
      tags:
      - Developer
      summary: My publisher profile & team
      operationId: get_dev_me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Developer'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: dev
  /dev/apps:
    post:
      tags:
      - Developer
      summary: Create app listing (draft)
      operationId: post_dev_apps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevApp'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevApp'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: dev
    get:
      tags:
      - Developer
      summary: My apps
      operationId: get_dev_apps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DevApp'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: dev
  /dev/apps/{appId}:
    patch:
      tags:
      - Developer
      summary: Edit listing text, icon, screenshots
      operationId: patch_dev_apps_appId
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevApp'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevApp'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: dev
  /dev/apps/{appId}/assets:
    post:
      tags:
      - Developer
      summary: Presigned upload for icon / screenshots
      operationId: post_dev_apps_appId_assets
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                contentType:
                  type: string
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  publicUrl:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: dev
  /dev/apps/{appId}/plans:
    put:
      tags:
      - Developer
      summary: Set pricing plans
      operationId: put_dev_apps_appId_plans
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Plan'
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: dev
  /dev/apps/{appId}/versions:
    post:
      tags:
      - Developer
      summary: Create version → presigned bundle upload URL
      operationId: post_dev_apps_appId_versions
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVersionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: dev
  /dev/versions/{versionId}/submit:
    post:
      tags:
      - Developer
      summary: Submit for automated checks + review
      operationId: post_dev_versions_versionId_submit
      parameters:
      - name: versionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: dev
  /dev/versions/{versionId}:
    get:
      tags:
      - Developer
      summary: Version status, checks and reviewer notes
      operationId: get_dev_versions_versionId
      parameters:
      - name: versionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: dev
  /dev/versions/{versionId}/rollout:
    post:
      tags:
      - Developer
      summary: Change staged rollout % (after approval)
      operationId: post_dev_versions_versionId_rollout
      parameters:
      - name: versionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rolloutPct:
                  type: integer
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-permission: dev
  /dev/versions/{versionId}/withdraw:
    post:
      tags:
      - Developer
      summary: Withdraw a version (halts rollout)
      operationId: post_dev_versions_versionId_withdraw
      parameters:
      - name: versionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
